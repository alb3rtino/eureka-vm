# Virtual Machine Configuration

# -- Resources (adjust to your hardware) --
VM_MEMORY="31744"  # Memory in MB (minimum 20280)
VM_CPUS="8"        # Number of CPU cores
VM_DISK_SIZE="40G" # Disk size
SSH_PUBKEY_PATH="$HOME/.ssh/id_ed25519.pub" # Path to your SSH public key

# -- Network --
VM_STATIC_IP="192.168.122.40"  # Static IP on the libvirt default network, assumes /24 with gateway at .1 (comment out for DHCP)

# -- Versions --
VM_NAME="eureka-vm"
UBUNTU_VERSION="24.04"
GO_VERSION="1.26.5" # Keep in sync with the go directive in eureka-setup's eureka-cli/go.mod
